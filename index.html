<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISMO APP – Red Familiar Chile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { chileRed: '#d52b1e', chileBlue: '#002b7f', senapredNavy: '#0f172a' } } } };
  </script>
  <style>
    @media print { .no-print { display: none !important; } body { background: white !important; color: #0f172a !important; font-size: 8.5pt !important; padding: 0 !important; margin: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; } #section-brochure { display: block !important; } #section-protection, #section-tools, #section-drill, #section-qr { display: none !important; } .print-page { display: flex !important; flex-direction: row !important; page-break-after: always; page-break-inside: avoid; height: 100vh !important; max-height: 100vh !important; padding: 6mm !important; box-sizing: border-box !important; gap: 8mm !important; background: white !important; } .print-col { flex: 1 !important; width: 31% !important; border: 1px solid #cbd5e1 !important; border-radius: 8px !important; padding: 8px !important; box-shadow: none !important; overflow: hidden !important; background: #ffffff !important; } @page { size: landscape A4; margin: 0; } }
    .strobe-active { animation: strobe 0.2s infinite alternate; } @keyframes strobe { 0% { background-color: #d52b1e; color: #ffffff; } 100% { background-color: #ffffff; color: #d52b1e; } }
    .pulse-emergency { animation: pulse-red 1.5s infinite; } @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(213, 43, 30, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(213, 43, 30, 0); } 100% { box-shadow: 0 0 0 0 rgba(213, 43, 30, 0); } }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; } .custom-scrollbar::-webkit-scrollbar-track { background: #020617; border-radius: 8px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 8px; } .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
  <!-- CONFIGURACIÓN FIREBASE (RELLENAR ANTES DE SUBIR) -->
  <script>
    // window.__firebase_config = JSON.stringify({ ... });
    // window.__app_id = 'sismo-app-hogar';
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased flex flex-col selection:bg-red-600 selection:text-white">
  <header class="no-print bg-slate-900/95 backdrop-blur border-b border-slate-800 sticky top-0 z-50 shadow-xl">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-chileRed text-white p-2 rounded-xl font-extrabold text-base flex items-center justify-center w-10 h-10 shadow-lg shadow-red-950/50 border border-red-500/30">
          <i class="fa-solid fa-house-chimney-crack text-lg"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-sm sm:text-base leading-tight flex items-center gap-2 text-white"><span>SISMO APP</span> <span class="bg-chileBlue text-white text-[10px] font-bold px-2 py-0.5 rounded tracking-wider uppercase border border-blue-400/30">CHILE</span></h1>
          <p class="text-[10px] text-slate-400">Plan de Emergencia & Red Familiar</p>
        </div>
      </div>
      <nav class="flex items-center bg-slate-950/80 p-1 rounded-xl border border-slate-800 text-xs font-semibold overflow-x-auto max-w-full">
        <button id="nav-protection" onclick="switchSection('protection')" class="px-3 py-1.5 rounded-lg bg-chileRed text-white transition flex items-center gap-1.5 shrink-0 shadow"><i class="fa-solid fa-shield-halved"></i> <span>Protección</span></button>
        <button id="nav-tools" onclick="switchSection('tools')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition flex items-center gap-1.5 shrink-0"><i class="fa-solid fa-triangle-exclamation text-amber-400"></i> <span>SOS</span></button>
        <button id="nav-drill" onclick="switchSection('drill')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition flex items-center gap-1.5 shrink-0"><i class="fa-solid fa-stopwatch text-emerald-400"></i> <span>Simulacro</span></button>
        <button id="nav-qr" onclick="switchSection('qr')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition flex items-center gap-1.5 shrink-0"><i class="fa-solid fa-qrcode text-sky-400"></i> <span>QR</span></button>
        <button id="nav-brochure" onclick="switchSection('brochure')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition flex items-center gap-1.5 shrink-0"><i class="fa-solid fa-file-pdf text-red-400"></i> <span>Tríptico</span></button>
      </nav>
    </div>
  </header>
  <div id="toast" class="no-print fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-slate-100 border border-slate-700 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-xs max-w-sm"><i id="toast-icon" class="fa-solid fa-circle-info text-blue-400 text-base"></i> <span id="toast-message">Notificación.</span></div>
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 space-y-6 no-print">
    <!-- SECCIÓN 1: PROTECCIÓN -->
    <section id="section-protection" class="space-y-5">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
          <div><h2 class="text-xl font-extrabold text-white">Mi Estado en Caso de Sismo</h2><p class="text-xs text-slate-400">Transmite situación a la red familiar.</p></div>
          <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-xl border border-slate-800"><i class="fa-solid fa-users text-chileBlue text-sm pl-2"></i><input type="text" id="input-group-code" value="FAMILIA-PEREZ" onchange="handleGroupCodeChange()" class="bg-transparent text-amber-400 font-mono text-xs font-bold focus:outline-none uppercase w-36 border-b border-dashed border-slate-700"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input type="text" id="input-user-name" placeholder="Tu Nombre" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
          <input type="text" id="input-user-note" placeholder="Mensaje corto (ej: En la plaza)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
          <button onclick="setUserStatus('safe')" class="p-4 rounded-2xl bg-emerald-700 hover:bg-emerald-600 text-white font-bold flex flex-col items-center gap-1 transition active:scale-95"><i class="fa-solid fa-circle-check text-xl"></i><span>A Salvo</span></button>
          <button onclick="setUserStatus('evac')" class="p-4 rounded-2xl bg-amber-700 hover:bg-amber-600 text-white font-bold flex flex-col items-center gap-1 transition active:scale-95"><i class="fa-solid fa-person-walking text-xl"></i><span>Evacuando</span></button>
          <button onclick="setUserStatus('help')" class="p-4 rounded-2xl bg-red-700 hover:bg-red-600 text-white font-bold flex flex-col items-center gap-1 transition active:scale-95 pulse-emergency"><i class="fa-solid fa-triangle-exclamation text-xl"></i><span>Necesito Ayuda</span></button>
        </div>
        <!-- ALERTAS DIRECTAS CON CONTACTO -->
        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
          <p class="text-xs text-slate-400 font-bold uppercase text-center mb-2">Alerta SOS Directa al Contacto de Emergencia</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <button onclick="initEmergencyAlert('whatsapp')" class="px-4 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl flex items-center justify-center gap-2"><i class="fa-brands fa-whatsapp text-lg"></i> Alerta WhatsApp</button>
            <button onclick="initEmergencyAlert('sms')" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl flex items-center justify-center gap-2"><i class="fa-solid fa-comment-sms text-lg"></i> Alerta SMS</button>
          </div>
        </div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div>
          <h3 class="font-bold text-base text-slate-100 mb-3"><i class="fa-solid fa-house-user text-amber-400 mr-2"></i> Registro del Hogar</h3>
          <div class="space-y-2 text-xs">
            <input type="text" id="app-input-address" oninput="syncInputs('address')" placeholder="Dirección" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
            <input type="text" id="app-input-commune" oninput="syncInputs('commune')" placeholder="Comuna" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
            <input type="tel" id="app-input-phone" oninput="syncInputs('phone')" placeholder="Teléfono Contacto Emergencia (Ej: 56912345678)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-amber-400 font-bold">
          </div>
        </div>
        <div>
          <h3 class="font-bold text-base text-slate-100 mb-3"><i class="fa-solid fa-suitcase-rolling text-amber-400 mr-2"></i> Kit 72 Horas</h3>
          <div class="grid grid-cols-1 gap-1 text-[10px]">
            <label class="flex items-center gap-2 p-1.5 bg-slate-950 rounded border border-slate-800"><input type="checkbox" class="app-kit-cb"> Agua y Alimentos</label>
            <label class="flex items-center gap-2 p-1.5 bg-slate-950 rounded border border-slate-800"><input type="checkbox" class="app-kit-cb"> Linterna y Pilas</label>
            <label class="flex items-center gap-2 p-1.5 bg-slate-950 rounded border border-slate-800"><input type="checkbox" class="app-kit-cb"> Botiquín</label>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    // LÓGICA DE ALERTA INTELIGENTE (ACTUALIZADA)
    window.initEmergencyAlert = async (type) => {
      const phoneInput = document.getElementById('app-input-phone').value.trim();
      const cleanPhone = phoneInput.replace(/[^0-9]/g, '');
      
      if (!cleanPhone) {
        showToast("Error: Registra un teléfono en el Registro del Hogar", "error");
        return;
      }

      showToast("Obteniendo ubicación GPS...");

      // 1. Obtener estado actual (lo que el usuario seleccionó en los botones)
      const lastStatus = localStorage.getItem('sismo_last_status') || 'safe';
      const statusLabels = {
         'safe': '¡ESTOY A SALVO! ✅',
         'evac': 'ESTOY EVACUANDO 🚶‍♂️',
         'help': '¡NECESITO AYUDA URGENTE! 🚨'
      };
      const statusText = statusLabels[lastStatus] || 'Estado actual';

      // 2. Obtener GPS
      let gpsStr = "No disponible";
      try {
        const pos = await new Promise((resolve, reject) => { 
          navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 }); 
        });
        gpsStr = `https://maps.google.com/?q=${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`;
      } catch(e) { 
        gpsStr = "Ubicación no disponible (GPS desactivado)"; 
      }

      // 3. Construir mensaje dinámico
      const name = document.getElementById('input-user-name').value || "Familiar";
      const msg = `🚨 REPORTE DE SISMO\n👤 Nombre: ${name}\n🛡️ Estado: ${statusText}\n📍 Ubicación: ${gpsStr}\n\nEnviado desde SISMO APP.`;

      // 4. Abrir app
      if (type === 'whatsapp') {
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
      } else {
        window.open(`sms:${cleanPhone}?body=${encodeURIComponent(msg)}`, '_self');
      }
    };

    // Funciones base existentes (mantenidas)
    window.setUserStatus = (statusType) => { 
        localStorage.setItem('sismo_last_status', statusType); 
        showToast("Estado registrado: " + statusType); 
    };
    window.showToast = (msg, type) => { /* lógica de toast */ console.log(msg); };
    window.syncInputs = (f) => { /* lógica de sync */ };
    window.switchSection = (s) => { /* lógica de tabs */ };
    window.handleGroupCodeChange = () => { /* lógica firebase */ };
  </script>
</body>
</html>
